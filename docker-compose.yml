version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bytevox_postgres
    restart: always
    environment:
      POSTGRES_USER: bytevox
      POSTGRES_PASSWORD: bytevox_secret_password
      POSTGRES_DB: bytevox_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bytevox -d bytevox_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./be
      dockerfile: Dockerfile
    container_name: bytevox_backend
    restart: always
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      NODE_ENV: production
      DATABASE_URL: postgresql://bytevox:bytevox_secret_password@postgres:5432/bytevox_db?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./fe
      dockerfile: Dockerfile
    container_name: bytevox_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
      NEXT_PUBLIC_WS_URL: ws://localhost:3001/ws
    depends_on:
      - backend

volumes:
  postgres_data:
